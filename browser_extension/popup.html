<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberShield AI</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --low: #10b981;
      --med: #f59e0b;
      --high: #f97316;
      --crit: #ef4444;
    }
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
      margin-bottom: 12px;
    }
    .logo-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: var(--primary);
    }
    .current-url-box {
      background: var(--card);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .url-text {
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
      max-height: 45px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .scan-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: white;
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .scan-btn:hover { opacity: 0.9; }
    .result-box {
      display: none;
      background: var(--card);
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #334155;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .score-badge {
      font-size: 20px;
      font-weight: 800;
      font-family: monospace;
    }
    .pill {
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
    }
    .pill.low { background: var(--low); color: white; }
    .pill.medium { background: var(--med); color: black; }
    .pill.high { background: var(--high); color: white; }
    .pill.critical { background: var(--crit); color: white; }
    .reasons-list {
      list-style: none;
      padding: 0;
      margin: 8px 0;
      font-size: 11px;
    }
    .reasons-list li {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .recommendation {
      font-size: 11px;
      color: #cbd5e1;
      padding-top: 8px;
      border-top: 1px solid #334155;
      margin-top: 8px;
      line-height: 1.4;
    }
    .action-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-leave {
      flex: 1;
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-dismiss {
      flex: 1;
      background: #334155;
      color: white;
      border: none;
      padding: 6px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .dashboard-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      color: var(--primary);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      CyberShield AI
    </div>
    <span style="font-size: 10px; color: var(--muted);">v1.0.0</span>
  </div>

  <div class="current-url-box">
    <div style="font-size: 11px; font-weight: 600; margin-bottom: 4px;">Target URL / Active Tab:</div>
    <div id="activeUrl" class="url-text">Loading current tab...</div>
    <button id="scanBtn" class="scan-btn">Scan URL with AI</button>
  </div>

  <div id="resultBox" class="result-box">
    <div class="score-row">
      <div>
        <span class="score-badge" id="riskScore">0</span>
        <span style="font-size: 10px; color: var(--muted);"> / 100 Risk</span>
      </div>
      <span id="severityPill" class="pill low">LOW</span>
    </div>
    <div id="threatTitle" style="font-weight: 700; margin-bottom: 6px;"></div>
    <div style="font-size: 11px; color: var(--muted); margin-bottom: 4px;">Explainable AI Analysis:</div>
    <ul id="reasonsList" class="reasons-list"></ul>
    <div id="recommendation" class="recommendation"></div>
    <div id="actionButtonGroup" class="action-buttons" style="display:none;">
      <button id="leavePageBtn" class="btn-leave">Leave Site Safely</button>
      <button id="dismissBtn" class="btn-dismiss">Proceed Anyway</button>
    </div>
  </div>

  <a href="http://localhost:8000" target="_blank" class="dashboard-link">Open Full Web Dashboard &rarr;</a>

  <script src="popup.js"></script>
</body>
</html>
